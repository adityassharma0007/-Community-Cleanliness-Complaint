<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - CleanCity</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main>
    <div class="card form-card">
      <h1>Welcome back</h1>
      <p class="muted">Log in to report issues and see your complaints.</p>

      <div id="error" class="alert alert-error" role="alert" hidden></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Log in</button>
      </form>

      <p class="form-foot">New here? <a href="signup.html">Create an account</a></p>

      <div class="demo-box">
        <p><strong>Demo accounts</strong></p>
        <p>Resident: riya@example.com / demo123</p>
        <p>Admin: admin@cleancity.com / admin123</p>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="app.js"></script>
  <script>
    // Already logged in? Go straight to the complaints page.
    if (currentUser()) location.href = 'complaints.html';

    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error');

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      const problem = login(
        document.getElementById('email').value,
        document.getElementById('password').value
      );

      if (problem) {
        errorBox.textContent = problem;
        errorBox.hidden = false;
        return;
      }
      location.href = safeNextPage();
    });
  </script>
</body>
</html>
